<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#08090c" />
    <meta name="description" content="Rebell Chess 3D – Premium-3D-Schach im Browser, gegen die KI oder zu zweit." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rebell Chess" />
    <title>Rebell Chess 3D</title>
    <style>
      /* Ladebildschirm, bis das Spiel startet (React ersetzt den Inhalt von #root) */
      html, body { margin: 0; height: 100%; background: #07080b; }
      .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 18px;
        background: radial-gradient(ellipse at 50% 40%, #1c1a17 0%, #07080b 70%); color: #e2b85c;
        font-family: Georgia, 'Times New Roman', serif; }
      .boot-crest { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font-size: 44px; color: #1d160a;
        background: radial-gradient(circle at 35% 30%, #fff1c4, #e2b85c 55%, #8d6424); box-shadow: 0 0 60px rgba(226, 185, 92, 0.35);
        animation: boot-pulse 1.6s ease-in-out infinite; }
      .boot-title { font-size: clamp(26px, 7vw, 42px); letter-spacing: 0.18em; font-weight: 700; }
      .boot-title span { color: #cdd2db; }
      .boot-bar { width: 180px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
      .boot-bar::after { content: ''; display: block; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, #f7dc93, transparent);
        animation: boot-run 1.1s linear infinite; }
      @keyframes boot-pulse { 50% { box-shadow: 0 0 90px rgba(226, 185, 92, 0.55); } }
      @keyframes boot-run { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-label="Rebell Chess">
        <div class="boot-crest">&#9822;&#xFE0E;</div>
        <div class="boot-title">REBELL <span>CHESS</span></div>
        <div class="boot-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
